# Overlay lane manifest — Parasite Eve (USA) Disc 1, PE.IMG overlays.
#
# This file is the committed authority for WHERE each overlay lives and WHAT
# its bytes must hash to. It contains facts only (sector ranges, VRAM, sizes,
# SHA-1s); the bytes are extracted locally by `scripts/extract_overlays.sh`
# into git-ignored build/extracted/disc1/peimg/ and are never committed.
#
# Read by tools/build/overlay_targets.py with a stdlib-only YAML-subset reader:
# only `key: value` scalars and nested mappings (two-space indentation) are
# allowed here — no lists, no flow syntax, no multi-line scalars.
#
# Evidence (2026-09-22 overlay survey, re-verified in tree by
# tools/extract/peimg.py tables):
#   * PE.IMG is the only overlay-bearing disc file; it is byte-identical on
#     both discs (docs/reverse_engineering_notes.md) and sits at LBA 1013.
#   * The EXE halfword table D_80093150 holds 21 sector boundaries of PE.IMG
#     image-load ranges; the word table D_8001160C holds the four fixed load
#     addresses; D_80093378 is the 438-slot room package table
#     ({u32 rel, u32 packed} with packed = sec0 | sec1<<8 | sec2<<20 and
#     base LBA D_800B0DD8 = 1013).
#   * Only six of the image-load ranges carry MIPS code (whole-image aligned
#     `jr $ra` map: 170 hits inside them, 9,135 inside room chunk 2s, 0
#     elsewhere). They are position-dependent binaries with no PS-X header and
#     no relocations: a splat `code` segment at a fixed `vram`.
#   * Several overlays share one arena (0x8018EFF0 hosts ovl_03D2, ovl_0700
#     and, at 0x8018EFE8, every room chunk 2), so `func_801xxxxx` names are
#     only unique WITHIN an overlay: sources are namespaced by directory,
#     src/overlays/<id>/, and two overlays are never linked together.
#   * `scan_*` fields are the raw boundary-scan facts (first framed prologue,
#     last `jr $ra` + 8 bytes). `text_start`/`text_end` are only recorded once
#     the window was audited for a splat config (ovl_0700: first prologue 0x6C,
#     last `jr $ra` at 0xCFCC + delay slot, zero pad, then data; 44 prologues,
#     157 of 186 in-blob `jal` targets land on a prologue at this base).
