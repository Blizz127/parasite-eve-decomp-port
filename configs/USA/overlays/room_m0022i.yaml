# Splat config — Parasite Eve (USA) Disc 1, PE.IMG room package m0022i,
# chunk 2 (the MIPS-bearing chunk). Proof-of-concept room target.
#
# The target blob is extracted locally by
#   python3 tools/extract/peimg.py room m0022i
#   (or scripts/extract_overlays.sh --room m0022i)
# into build/extracted/disc1/peimg/room_m0022i_c2.bin (git-ignored) and is
# NEVER committed. Split via `scripts/split_overlay.sh room_m0022i`; the exact
# reassembly proof is `scripts/exact_rebuild_overlay.sh room_m0022i`.
#
# Verified facts (tools/extract/peimg.py room m0022i, 2026-09-22):
#   slot 21, rel 12513, sectors (33, 97, 53); chunk 2 = PE.IMG sectors
#   [0x3163,0x3198), size 0x1A800, vram 0x8018EFE8 (rooms.chunk2_vram),
#   SHA-1 3231b287bdde6fb55bcc3734f5be6ff4906ab0c3.
#   No header, no relocations: absolute 0x8018xxxx pointers in the jump
#   tables and data, so one fixed-address `code` segment.
#
# Geometry (boundary audit of the extracted blob):
#   0x0000-0x01E4  u32 0x1A438, u32 0x1A28C, u32 0x10, then switch jump
#                  tables (absolute pointers into .text, 0x2BC..0x27F4).
#                  Raw `bin`.
#   0x01E4-0x3500  .text: first word `jr $ra` (a two-word leaf) right after
#                  the last jump-table pointer; last `jr $ra` at 0x34F8 + delay
#                  slot. 53 `jr $ra`, 18 framed prologues.
#   0x3500-0x1A800 data: behaviour/handler pointer tables (0x8018F1CC ...)
#                  then room data. Raw `bin`.
#
# Room census (docs/ai_context/ROOM_LANE_SCOPING.md): this text window is
# byte-identical in 30 code rooms (the largest identical-text group), always
# at the same offset, so every leaf matched here holds for all 30 by byte
# identity. Functions are named func_<VRAM> and live under
# src/overlays/room_m0022i/ (the 0x8018EFE8 arena is shared by every room and
# by ovl_03D2/ovl_0700, so the directory is the namespace).
