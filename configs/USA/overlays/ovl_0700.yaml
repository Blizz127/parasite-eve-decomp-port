# Splat config — Parasite Eve (USA) Disc 1, PE.IMG overlay ovl_0700
# (map-exit / destination-chooser overlay, image-load range [0x700,0x7B7)).
#
# The target blob is extracted locally by `scripts/extract_overlays.sh` into
# build/extracted/disc1/peimg/ovl_0700.bin (git-ignored) and is NEVER
# committed. Split via `scripts/split_overlay.sh ovl_0700`; the exact
# reassembly proof is `scripts/exact_rebuild_overlay.sh ovl_0700`.
#
# Verified facts (configs/USA/overlays/manifest.yaml, tools/extract/peimg.py):
#   size   0x5B800 = 183 sectors x 2048
#   SHA-1  9f8786a9d6f8b11548a14680d34fc540d8e909de
#   vram   0x8018EFF0 (EXE dest table D_8001160C[2] = D_80011614)
#   no PS-X header, no relocations: one fixed-address `code` segment.
#
# Geometry (2026-09-22 boundary audit of the extracted blob):
#   0x0000-0x006C  container header: u32 count (13), 13 x 8-byte entries, then
#                  a 10-word handler pointer table (0x801920FC ...). Kept as a
#                  raw `bin` span so reassembly is byte-exact by construction.
#   0x006C-0xCFD4  .text: first prologue at 0x6C, last `jr $ra` at 0xCFCC plus
#                  its delay slot (44 framed prologues, 57 `jr $ra`; 157 of the
#                  186 in-blob `jal` targets land on a prologue at this base).
#   0xCFD4-0x5B800 zero alignment pad, then data (0x94000000 ...) to the end
#                  of the blob; no further `jr $ra`. Raw `bin`.
#
# Every function in this overlay is named func_<VRAM> and lives, once carved,
# under src/overlays/ovl_0700/. That directory is the namespace: ovl_03D2 and
# every room chunk 2 share the 0x8018EFF0 arena, so the same func_801xxxxx
# name means a DIFFERENT function in another overlay.
name: Parasite Eve (USA) Disc 1 PE.IMG overlay ovl_0700
sha1: 9f8786a9d6f8b11548a14680d34fc540d8e909de
options:
  platform: psx
  compiler: GCC
  basename: ovl_0700
  # Paths are relative to base_path, which is relative to this file:
  # configs/USA/overlays/ -> repo root.
  base_path: ../../..
  target_path: build/extracted/disc1/peimg/ovl_0700.bin
  asm_path: asm/overlays/ovl_0700
  src_path: src/overlays/ovl_0700
  asset_path: assets/overlays/ovl_0700
  ld_script_path: linkers/overlays/ovl_0700.ld
  # Keep every splat side output inside the overlay's own ignored directory so
  # an overlay split never overwrites the EXE's undefined_*_auto.txt / .splache.
  cache_path: asm/overlays/ovl_0700/.splache
  undefined_funcs_auto_path: asm/overlays/ovl_0700/undefined_funcs_auto.txt
  undefined_syms_auto_path: asm/overlays/ovl_0700/undefined_syms_auto.txt
  find_file_boundaries: no
